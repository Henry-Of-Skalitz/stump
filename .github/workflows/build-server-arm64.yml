name: Build Server ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  server-arm64:
    runs-on: ubuntu-24.04-arm # runner ARM64 nativo — grátis para repos públicos

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Esta Action lê o rust-toolchain.toml do repositório automaticamente 
      # e adiciona o target solicitado diretamente na versão correta do Rust.
      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-arm64-gnu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-arm64-gnu-

      # Como o openssl não será "vendored" no target gnu, precisamos das dependências nativas
      - name: Instalar dependências nativas (OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build release
        run: cargo build --release --target aarch64-unknown-linux-gnu -p stump_server

      - name: Upload do binário
        uses: actions/upload-artifact@v4
        with:
          name: stump-server-arm64-gnu
          path: target/aarch64-unknown-linux-gnu/release/stump_server
          retention-days: 14