name: Build Android Standalone APK

on:
  workflow_dispatch: # Permite que você inicie a compilação manualmente com um botão no GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Versão recomendada para o ecossistema do Stump/Expo
          cache: 'yarn'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # React Native/Expo modernos exigem o JDK 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          yarn install

      - name: Prebuild Expo (Gerar pasta nativa do Android)
        run: |
          cd expo
          npx expo prebuild --platform android --no-install

      - name: Build Android App (Gerar APK de Produção)
        run: |
          cd expo/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stump-android-release-apk
          path: expo/android/app/build/outputs/apk/release/app-release.apk